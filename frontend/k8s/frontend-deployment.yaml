apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-bank-frontend
  namespace: default
  labels:
    app: digital-bank-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: digital-bank-frontend
  template:
    metadata:
      labels:
        app: digital-bank-frontend
    spec:
      containers:
      - name: frontend
        image: digital-bank-frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: VITE_API_BASE_URL
          value: "/api"
        - name: VITE_ENV
          value: "production"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: digital-bank-frontend-service
  namespace: default
spec:
  selector:
    app: digital-bank-frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: digital-bank-frontend-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: digital-bank.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: digital-bank-frontend-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway-service
            port:
              number: 8080